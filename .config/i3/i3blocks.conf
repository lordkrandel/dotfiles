align=center
separator=false
markup=pango
separator_block_width=25

[time]
command=scripts/time.nim
interval=1

[battery]
command=scripts/battery.nim
interval=5

[ppd_menu]
full_text=" profile "
command=scripts/power_profiles.sh
interval=5

[volume-pulseaudio]
command=scripts/volume.nim
instance=Master
interval=1
timeout=10
signal=12

[brightness]
full_text=" brightness "
command=scripts/brightness.nim
interval=once
signal=10

[click-daysoff]
full_text=" daysoff "
command=~/work/scripts/days_off.sh

[shutdown_menu]
full_text=" power "
command=scripts/power_menu.sh
